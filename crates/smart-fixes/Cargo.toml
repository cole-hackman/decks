[package]
name = "smart-fixes"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lexicon-style one-click metadata cleanup proposals"

[dependencies]
serde = { workspace = true }
# The shared text engine — case-insensitive find that is correct for
